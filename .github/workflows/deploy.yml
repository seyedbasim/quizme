name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]

# Deploys the Azure Function App (Southeast Asia). Repo secrets required:
#   AZURE_CREDENTIALS       - service principal JSON (az ad sp create-for-rbac --sdk-auth)
#   AZURE_FUNCTIONAPP_NAME  - func-quizme-96616d
#   DATABASE_URL            - the same value as the KV `database-url` secret
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Run migrations (forward-only, AD-17)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv sync --extra dev
          uv run alembic upgrade head

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Publish Functions
        run: |
          npm i -g azure-functions-core-tools@4
          func azure functionapp publish ${{ secrets.AZURE_FUNCTIONAPP_NAME }} --python
