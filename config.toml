# Non-secret defaults. Per-environment values come from App settings / env vars.
# Secrets NEVER go here — they live in Azure Key Vault (AD-17).
# Local overrides: config.local.toml (gitignored).

[app]
region = "southeastasia"
timezone = "Asia/Singapore"

[ingest]
# FR-1 / FR-47
allowed_formats = ["m4a", "mp3", "wav"]
max_file_mb = 200
language = "en"                       # FR-3, English only for v1

[llm]
# AD-8: one default deployment + per-stage overrides.
endpoint = "https://aoai-quizme-96616d.openai.azure.com"
api_version = "2025-01-01-preview"
default_deployment = "chat"           # deployment name; model is gpt-5-mini (see below)
deployment_type = "global"            # GlobalStandard — the only SKU with quota on this
                                      # subscription/region right now (see docs §5.2 /
                                      # AD-13 caveat). Request DataZone quota to fix.
model_note = "gpt-5-mini 2025-08-07. Top-tier gpt-4.1 / gpt-5.2 have 0 default quota on this VS/MCT subscription — needs a quota-increase request. Flip default_deployment (or just the consolidation/grade overrides) when granted."
temperature = 0.0

# Per-stage overrides — e.g. once top-tier quota lands, point the judgement stages here:
[llm.stages]
# consolidate = "chat-4o"
# grade = "chat-4o"

[llm.consolidation]
# AD-15: only auto-merge above this confidence; below it, propose via Review Queue.
merge_confidence_threshold = 0.80
retrieval_neighbours = 6              # AD-6 bound

[transcription]
# Azure AI Speech (Whisper model) — available in southeastasia; Azure OpenAI Whisper is not.
mode = "batch"                        # batch | fast
model = "whisper"

[embeddings]
deployment = "embed"                  # deployment name; model text-embedding-3-small, GlobalStandard
dimensions = 1536

[quiz]
# FR-24 / FR-28
send_time_local = "07:30"
max_questions_per_day = 10
retrievability_threshold = 0.90
partial_streak_for_revisit = 2       # FR-41, PRD Open Q 10

[budget]
# FR-38 / FR-53 / AD-19. Credit is VS Enterprise $150/mo, hard cap.
monthly_credit_usd = 150
warn_at_pct = 60
throttle_at_pct = 80                  # above this, hold new ingestion (AD-19)

[review]
suppress_contradicted_kus_from_quiz = true   # FR-15 default
followup_confidence_threshold = 0.65         # FR-40, below → Review Queue
